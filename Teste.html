<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Líder Flow - Diagnóstico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-dark: #050b18;
            --accent-blue: #00d2ff;
            --accent-purple: #7000ff;
            --text-light: #e0e6ed;
            --card-bg: rgba(255, 255, 255, 0.05);
            --acao: #ff4b2b; --inspiracao: #ffb400; --harmonia: #2ecc71; --clareza: #3498db;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background-image: radial-gradient(circle at 20% 30%, rgba(0, 210, 255, 0.05) 0%, transparent 40%);
        }

        #quiz-container {
            width: 90%; max-width: 600px;
            background: var(--card-bg); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .screen { display: none; animation: fadeIn 0.5s ease forwards; }
        .active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        input[type="text"], input[type="email"] {
            width: 100%; padding: 15px; margin: 10px 0;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); color: white; font-size: 1rem;
        }

        .btn-main {
            width: 100%; padding: 15px; border-radius: 30px; border: none;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            color: white; font-weight: 700; cursor: pointer; margin-top: 20px;
        }

        .question-text { font-size: 1.2rem; text-align: center; margin-bottom: 30px; }

        .options { display: flex; justify-content: space-between; gap: 10px; }
        .opt-btn {
            flex: 1; height: 50px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
            background: none; color: white; cursor: pointer; transition: 0.3s;
        }
        .opt-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

        .result-bar-container { margin: 15px 0; text-align: left; }
        .bar-bg { width: 100%; height: 10px; background: rgba(0,0,0,0.4); border-radius: 5px; margin-top: 5px; }
        .bar-fill { height: 100%; border-radius: 5px; width: 0%; transition: width 1s ease-out; }

        #loading { display: none; text-align: center; margin-top: 10px; font-size: 0.8rem; color: var(--accent-blue); }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="screen-lead" class="screen active">
        <h2 style="text-align:center; margin-bottom:20px;">Inicie seu Diagnóstico</h2>
        <p style="text-align:center; opacity:0.7; margin-bottom:20px;">Descubra seu fluxo de liderança predominante.</p>
        <input type="text" id="user-name" placeholder="Seu Nome Completo" required>
        <input type="email" id="user-email" placeholder="Seu Melhor E-mail" required>
        <button class="btn-main" onclick="startQuiz()">Começar Teste</button>
    </div>

    <div id="screen-quiz" class="screen">
        <div style="text-align:right; font-size:0.8rem; margin-bottom:10px;" id="counter">1/16</div>
        <p id="q-text" class="question-text"></p>
        <div class="options">
            <button class="opt-btn" onclick="nextQuestion(1)">1</button>
            <button class="opt-btn" onclick="nextQuestion(2)">2</button>
            <button class="opt-btn" onclick="nextQuestion(3)">3</button>
            <button class="opt-btn" onclick="nextQuestion(4)">4</button>
            <button class="opt-btn" onclick="nextQuestion(5)">5</button>
        </div>
        <p style="display:flex; justify-content:space-between; margin-top:10px; font-size:0.7rem; opacity:0.5;">
            <span>NADA A VER</span><span>TOTALMENTE</span>
        </p>
    </div>

    <div id="screen-result" class="screen">
        <h2 style="text-align:center;">Resultado Final</h2>
        <div id="bars-wrapper"></div>
        <div id="winner-text" style="background:rgba(255,255,255,0.05); padding:15px; border-radius:10px; margin-top:20px; font-size:0.9rem;"></div>
        
        <button class="btn-main" onclick="downloadPDF()">Baixar Relatório em PDF</button>
        <div id="loading">Enviando resultados para a base de dados...</div>
    </div>
</div>

<script>
    const questions = [
        { t: 'acao', q: "Quando surge um problema urgente, ajo rapidamente para resolver." },
        { t: 'inspiracao', q: "Gosto de conversar e trocar ideias antes de tomar decisões." },
        { t: 'harmonia', q: "Prefiro seguir rotinas e métodos já testados." },
        { t: 'clareza', q: "Tenho o hábito de revisar meu trabalho rigorosamente." },
        { t: 'acao', q: "Gosto de assumir o comando e fazer as coisas acontecerem." },
        { t: 'inspiracao', q: "Sou motivado(a) por um ambiente leve e positivo." },
        { t: 'harmonia', q: "Prefiro planejar bem antes de começar uma tarefa nova." },
        { t: 'clareza', q: "Analiso informações com atenção e lógica antes de decidir." },
        { t: 'acao', q: "Prefiro ter autonomia total para decidir o que fazer." },
        { t: 'inspiracao', q: "Tenho facilidade em envolver as pessoas e gerar entusiasmo." },
        { t: 'harmonia', q: "Gosto de ajudar o time a manter a harmonia." },
        { t: 'clareza', q: "Consigo identificar possíveis falhas e agir preventivamente." },
        { t: 'acao', q: "Se algo não sai como o planejado, ajusto o rumo e sigo." },
        { t: 'inspiracao', q: "Tenho facilidade para lidar com diferentes pessoas." },
        { t: 'harmonia', q: "Prefiro ambientes previsíveis, onde sei o que esperar." },
        { t: 'clareza', q: "Sou exigente comigo mesmo(a) e busco alta qualidade." }
    ];

    const profiles = {
        acao: { n: "Ação (Executor)", c: "#ff4b2b", d: "Focado em resultados, direto e competitivo." },
        inspiracao: { n: "Inspiração (Comunicador)", c: "#ffb400", d: "Criativo, entusiasta e sociável." },
        harmonia: { n: "Harmonia (Planejador)", c: "#2ecc71", d: "Calmo, cooperativo e valoriza estabilidade." },
        clareza: { n: "Clareza (Analista)", c: "#3498db", d: "Analítico, detalhista e busca precisão." }
    };

    let currentIdx = 0;
    let userScores = { acao: 0, inspiracao: 0, harmonia: 0, clareza: 0 };
    let userData = { name: "", email: "" };

    function startQuiz() {
        userData.name = document.getElementById('user-name').value;
        userData.email = document.getElementById('user-email').value;
        if(!userData.name || !userData.email) return alert("Preencha os campos!");
        
        document.getElementById('screen-lead').classList.remove('active');
        document.getElementById('screen-quiz').classList.add('active');
        showQuestion();
    }

    function showQuestion() {
        document.getElementById('q-text').innerText = questions[currentIdx].q;
        document.getElementById('counter').innerText = `${currentIdx + 1}/${questions.length}`;
    }

    function nextQuestion(val) {
        userScores[questions[currentIdx].t] += val;
        currentIdx++;
        if(currentIdx < questions.length) {
            showQuestion();
        } else {
            showFinalResult();
        }
    }

    function showFinalResult() {
        document.getElementById('screen-quiz').classList.remove('active');
        document.getElementById('screen-result').classList.add('active');
        
        const wrapper = document.getElementById('bars-wrapper');
        let winner = { key: '', val: -1 };

        for(let p in userScores) {
            if(userScores[p] > winner.val) winner = { key: p, val: userScores[p] };
            const perc = (userScores[p] / 20) * 100;
            wrapper.innerHTML += `
                <div class="result-bar-container">
                    <span style="font-size:0.8rem">${profiles[p].n}</span>
                    <div class="bar-bg"><div class="bar-fill" style="width:${perc}%; background:${profiles[p].c}"></div></div>
                </div>
            `;
        }

        document.getElementById('winner-text').innerHTML = `<strong>Perfil Predominante: ${profiles[winner.key].n}</strong><br>${profiles[winner.key].d}`;
        
        saveToDatabase();
    }

    // --- FUNÇÃO PARA SALVAR NA PLANILHA GOOGLE ---
    function saveToDatabase() {
        document.getElementById('loading').style.display = 'block';
        
        // Aqui você colocaria a URL do seu Google Apps Script (explico abaixo)
        const webAppUrl = "https://script.google.com/macros/s/AKfycbxFUqUXg-Xw3pY0mgBKBCCFxEJtFg9mIoUyQXgJgg7aavdezVSBMlXpZjLkdvGmGldZew/exec"; 
        
        const payload = {
            data: new Date().toLocaleString(),
            nome: userData.name,
            email: userData.email,
            acao: userScores.acao,
            inspiracao: userScores.inspiracao,
            harmonia: userScores.harmonia,
            clareza: userScores.clareza
        };

        // Simulação de salvamento (Fetch)
        console.log("Enviando para DB:", payload);
        
        // Descomente quando tiver a URL:
        /*
        fetch(webAppUrl, { method: 'POST', body: JSON.stringify(payload) })
        .then(() => document.getElementById('loading').innerText = "Dados salvos com sucesso!")
        .catch(() => document.getElementById('loading').innerText = "Erro ao salvar na base.");
        */
    }

    // --- FUNÇÃO PARA GERAR PDF ---
    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(22);
        doc.text("Relatório Líder Flow", 20, 20);
        
        doc.setFontSize(12);
        doc.text(`Candidato: ${userData.name}`, 20, 40);
        doc.text(`E-mail: ${userData.email}`, 20, 50);
        
        doc.text("Pontuações:", 20, 70);
        doc.text(`- Ação: ${userScores.acao}/20`, 20, 80);
        doc.text(`- Inspiração: ${userScores.inspiracao}/20`, 20, 90);
        doc.text(`- Harmonia: ${userScores.harmonia}/20`, 20, 100);
        doc.text(`- Clareza: ${userScores.clareza}/20`, 20, 110);
        
        doc.save(`Resultado_LiderFlow_${userData.name}.pdf`);
    }
</script>
</body>
</html>
