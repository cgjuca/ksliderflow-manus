<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico Líder Flow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-dark: #050b18;
            --accent-blue: #004a8e; /* Azul da Logo */
            --accent-green: #208d45; /* Verde da Logo */
            --text-light: #e0e6ed;
            --card-bg: rgba(255, 255, 255, 0.07);
            --acao: #004a8e; --inspiracao: #ffb400; --harmonia: #208d45; --clareza: #3498db;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 74, 142, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(32, 141, 69, 0.15) 0%, transparent 40%);
        }

        #main-wrapper {
            width: 95%; max-width: 750px;
            background: var(--card-bg); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px; padding: 40px; box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        .screen { display: none; animation: slideUp 0.6s ease-out forwards; }
        .active { display: block; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        header { text-align: center; margin-bottom: 30px; }
        .logo-img { width: 120px; margin-bottom: 10px; }

        .lead-input {
            width: 100%; padding: 18px; margin-bottom: 15px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; color: white; font-size: 1rem; outline: none;
        }

        .question-text { font-size: 1.4rem; font-weight: 300; text-align: center; margin-bottom: 40px; }
        .options-row { display: flex; justify-content: space-between; gap: 10px; }
        .opt-circle {
            flex: 1; height: 55px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
            background: none; color: white; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .opt-circle:hover { background: var(--accent-blue); border-color: var(--accent-blue); transform: translateY(-5px); }

        .bar-container { margin: 18px 0; }
        .bar-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 5px; }
        .bar-outer { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .bar-inner { height: 100%; width: 0%; transition: width 1.2s ease-out; }

        .btn-action {
            width: 100%; padding: 18px; border-radius: 40px; border: none;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            color: white; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top: 25px;
        }

        #db-status { font-size: 0.75rem; text-align: center; margin-top: 15px; color: var(--accent-green); font-weight: 600; }
    </style>
</head>
<body>

<div id="main-wrapper">
    <header>
        <img src="https://i.ibb.co/LdqN0wS/logo-lider-flow.png" class="logo-img" alt="Líder Flow">
    </header>

    <div id="screen-lead" class="screen active">
        <h2 style="text-align:center; margin-bottom: 25px;">Diagnóstico Comportamental</h2>
        <input type="text" id="user-name" class="lead-input" placeholder="Seu Nome Completo">
        <input type="email" id="user-email" class="lead-input" placeholder="Seu E-mail Profissional">
        <button class="btn-action" onclick="startQuiz()">Iniciar Teste</button>
    </div>

    <div id="screen-quiz" class="screen">
        <p id="q-text" class="question-text"></p>
        <div class="options-row">
            <button class="opt-circle" onclick="handleAnswer(1)">1</button>
            <button class="opt-circle" onclick="handleAnswer(2)">2</button>
            <button class="opt-circle" onclick="handleAnswer(3)">3</button>
            <button class="opt-circle" onclick="handleAnswer(4)">4</button>
            <button class="opt-circle" onclick="handleAnswer(5)">5</button>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:15px; font-size:0.7rem; opacity:0.5;">
            <span>DISCORDO TOTALMENTE</span><span>CONCORDO TOTALMENTE</span>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <h3 style="text-align:center; margin-bottom:20px;">Seu Resultado</h3>
        <div id="bars-output"></div>
        <div id="profile-summary" style="background:rgba(255,255,255,0.05); padding:20px; border-radius:15px; margin-top:20px; font-size:0.9rem; border-left: 4px solid var(--accent-blue);"></div>
        <button class="btn-action" onclick="generatePDF()">Gerar Relatório em PDF</button>
        <p id="db-status"></p>
    </div>
</div>

<script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbxFUqUXg-Xw3pY0mgBKBCCFxEJtFg9mIoUyQXgJgg7aavdezVSBMlXpZjLkdvGmGldZew/exec";
    
    const profileData = {
        acao: { name: "Ação (Executor)", color: "#004a8e", fortes: "Focado em resultados, decisão rápida, autonomia.", fracos: "Impaciência, dificuldade em ouvir, centralização." },
        inspiracao: { name: "Inspiração (Comunicador)", color: "#ffb400", fortes: "Criatividade, entusiasmo, conexão interpessoal.", fracos: "Falta de foco, impulsividade, desorganização." },
        harmonia: { name: "Harmonia (Planejador)", color: "#208d45", fortes: "Calma, paciência, lealdade, mediador.", fracos: "Resistência a mudanças, evita conflitos, passividade." },
        clareza: { name: "Clareza (Analista)", color: "#3498db", fortes: "Precisão, organização, pensamento lógico.", fracos: "Perfeccionismo, lentidão na decisão, excesso de crítica." }
    };

    const questions = [
        { id: 'acao', txt: "Quando surge um problema urgente, ajo rapidamente para resolver." },
        { id: 'inspiracao', txt: "Gosto de conversar e trocar ideias antes de tomar decisões." },
        { id: 'harmonia', txt: "Prefiro seguir rotinas e métodos já testados." },
        { id: 'clareza', txt: "Tenho o hábito de revisar meu trabalho para garantir que tudo esteja correto." },
        { id: 'acao', txt: "Gosto de assumir o comando e fazer as coisas acontecerem." },
        { id: 'inspiracao', txt: "Sou motivado(a) por um ambiente leve, colaborativo e positivo." },
        { id: 'harmonia', txt: "Prefiro planejar bem antes de começar uma tarefa nova." },
        { id: 'clareza', txt: "Analiso todas as informações com atenção e lógica antes de decidir." },
        { id: 'acao', txt: "Prefiro ter autonomia total para decidir o que fazer." },
        { id: 'inspiracao', txt: "Tenho facilidade em envolver as pessoas e gerar entusiasmo." },
        { id: 'harmonia', txt: "Gosto de ajudar o time a manter a harmonia." },
        { id: 'clareza', txt: "Consigo identificar possíveis falhas e agir preventivamente." },
        { id: 'acao', txt: "Se algo não sai como o planejado, ajusto o rumo e sigo em frente." },
        { id: 'inspiracao', txt: "Tenho facilidade para lidar com diferentes pessoas e estilos." },
        { id: 'harmonia', txt: "Prefiro ambientes previsíveis, onde sei o que esperar." },
        { id: 'clareza', txt: "Sou exigente comigo mesmo(a) e busco entregar com qualidade." }
    ];

    let currentQ = 0;
    let scores = { acao: 0, inspiracao: 0, harmonia: 0, clareza: 0 };
    let user = { name: "", email: "" };

    function startQuiz() {
        user.name = document.getElementById('user-name').value;
        user.email = document.getElementById('user-email').value;
        if(!user.name || !user.email) return alert("Preencha seus dados!");
        document.getElementById('screen-lead').classList.remove('active');
        document.getElementById('screen-quiz').classList.add('active');
        renderQuestion();
    }

    function renderQuestion() {
        document.getElementById('q-text').innerText = questions[currentQ].txt;
    }

    function handleAnswer(val) {
        scores[questions[currentQ].id] += val;
        currentQ++;
        if(currentQ < questions.length) renderQuestion();
        else finalize();
    }

    function finalize() {
        document.getElementById('screen-quiz').classList.remove('active');
        document.getElementById('screen-result').classList.add('active');

        const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
        const winner = profileData[sorted[0][0]];

        const output = document.getElementById('bars-output');
        for(let key in scores) {
            const perc = (scores[key] / 20) * 100;
            output.innerHTML += `
                <div class="bar-container">
                    <div class="bar-label"><span>${profileData[key].name}</span><span>${perc}%</span></div>
                    <div class="bar-outer"><div class="bar-inner" style="width:${perc}%; background:${profileData[key].color}"></div></div>
                </div>
            `;
        }

        document.getElementById('profile-summary').innerHTML = `
            <strong>Perfil Predominante: ${winner.name}</strong><br><br>
            <strong>Pontos Fortes:</strong> ${winner.fortes}<br>
            <strong>Pontos de Atenção:</strong> ${winner.fracos}
        `;

        // Enviar para o Google Sheets
        fetch(webAppUrl, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ ...user, ...scores })
        }).then(() => document.getElementById('db-status').innerText = "✓ Dados salvos com sucesso!");
    }

    async function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
        const winner = profileData[sorted[0][0]];

        // Design do Relatório
        doc.setFillColor(0, 74, 142); // Azul Líder Flow
        doc.rect(0, 0, 210, 40, 'F');
        
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(22);
        doc.text("Relatório de Liderança", 20, 25);
        
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(12);
        doc.text(`Candidato: ${user.name}`, 20, 55);
        doc.text(`Data: ${new Date().toLocaleDateString()}`, 20, 62);
        
        doc.setFontSize(16);
        doc.setTextColor(0, 74, 142);
        doc.text(`Perfil Dominante: ${winner.name}`, 20, 80);
        
        doc.setTextColor(0,0,0);
        doc.setFontSize(12);
        doc.text("Análise de Competências:", 20, 95);
        
        let y = 105;
        for(let [key, val] of Object.entries(scores)) {
            const perc = (val/20)*100;
            doc.setFillColor(240, 240, 240);
            doc.rect(20, y, 160, 8, 'F');
            doc.setFillColor(profileData[key].color);
            doc.rect(20, y, (160 * perc) / 100, 8, 'F');
            doc.text(`${profileData[key].name}: ${perc}%`, 20, y - 2);
            y += 20;
        }

        doc.setFontSize(14);
        doc.setTextColor(32, 141, 69); // Verde Líder Flow
        doc.text("Pontos Fortes:", 20, y + 10);
        doc.setFontSize(11);
        doc.setTextColor(0,0,0);
        doc.text(doc.splitTextToSize(winner.fortes, 170), 20, y + 18);

        doc.setFontSize(14);
        doc.setTextColor(180, 0, 0); 
        doc.text("Pontos de Atenção:", 20, y + 35);
        doc.setFontSize(11);
        doc.setTextColor(0,0,0);
        doc.text(doc.splitTextToSize(winner.fracos, 170), 20, y + 43);

        doc.save(`LiderFlow_${user.name}.pdf`);
    }
</script>

</body>
</html>
