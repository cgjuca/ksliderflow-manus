<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Perfil Comportamental - Líder Flow</title>
    <meta name="description" content="Descubra seu perfil comportamental com o teste interativo da Metodologia Líder Flow">
    <meta property="og:title" content="Teste de Perfil Comportamental - Líder Flow">
    <meta property="og:description" content="Descubra seu perfil comportamental com o teste interativo da Metodologia Líder Flow">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ksliderflow.com.br/teste-perfil.html">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        /* Form Section */
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e40af;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1e40af;
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        /* Questions Section */
        .questions-section {
            display: none;
        }

        .questions-section.active {
            display: block;
        }

        .question-container {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
            border-left: 4px solid #1e40af;
            transition: all 0.3s ease-out;
            opacity: 1;
            transform: translateY(0);
        }

        .question-number {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 15px;
        }

        .scale-container {
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }

        .scale-button {
            flex: 1;
            padding: 12px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            color: #6b7280;
        }

        .scale-button:hover {
            border-color: #1e40af;
            background: #eff6ff;
        }

        .scale-button.selected {
            background: #1e40af;
            color: white;
            border-color: #1e40af;
        }

        .scale-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1e40af, #3b82f6);
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            margin-top: 8px;
            font-size: 0.9rem;
            color: #6b7280;
        }

        /* Results Section */
        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .results-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .results-header h2 {
            font-size: 2rem;
            color: #1e40af;
            margin-bottom: 10px;
        }

        .profile-name {
            font-size: 1.5rem;
            color: #059669;
            font-weight: 700;
        }

        .profile-description {
            margin-top: 15px;
            padding: 20px;
            background: #f0fdf4;
            border-left: 4px solid #059669;
            border-radius: 6px;
            color: #166534;
            line-height: 1.6;
        }

        .chart-container {
            margin: 40px 0;
            padding: 30px;
            background: #f9fafb;
            border-radius: 8px;
        }

        .chart-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 20px;
        }

        .profile-bar {
            margin-bottom: 20px;
        }

        .profile-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        .bar {
            width: 100%;
            height: 30px;
            background: #e5e7eb;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            transition: width 0.5s ease-out;
        }

        .bar-fill.acao { background: linear-gradient(90deg, #dc2626, #ef4444); }
        .bar-fill.inspiracao { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .bar-fill.harmonia { background: linear-gradient(90deg, #10b981, #34d399); }
        .bar-fill.clareza { background: linear-gradient(90deg, #3b82f6, #60a5fa); }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #1e40af;
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .btn-primary:hover {
            background: #1e3a8a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #1f2937;
            flex: 1;
            min-width: 150px;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .btn-success {
            background: #059669;
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .btn-success:hover {
            background: #047857;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .content {
                padding: 20px;
            }

            .scale-container {
                gap: 5px;
            }

            .scale-button {
                padding: 8px;
                font-size: 0.9rem;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #dc2626;
        }

        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border-left: 4px solid #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Teste de Perfil Comportamental</h1>
            <p>Descubra seu perfil na Metodologia Líder Flow</p>
        </div>

        <div class="content">
            <div id="alertContainer"></div>

            <!-- Form Section -->
            <div class="form-section active">
                <h2>Seus Dados</h2>
                <div class="form-group">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="startQuestions()">Começar Teste</button>
                </div>
            </div>

            <!-- Questions Section -->
            <div class="questions-section">
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">Pergunta 1 de 16</div>
                </div>
                <div id="questionsContainer"></div>
            </div>

            <!-- Results Section -->
            <div class="results-section">
                <div class="results-header">
                    <h2>Seu Perfil Comportamental</h2>
                    <div class="profile-name" id="profileName">Carregando...</div>
                    <div class="profile-description" id="profileDescription"></div>
                </div>
                <div class="chart-container">
                    <div class="chart-title">Distribuição de Perfis</div>
                    <div id="resultsChart"></div>
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="downloadPDF()">📥 Baixar PDF</button>
                    <button class="btn-success" onclick="sendToSheets()">📊 Enviar para Planilha</button>
                    <button class="btn-secondary" onclick="restartTest()">🔄 Fazer Novamente</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Descrições dos Perfis
        const profileDescriptions = {
            acao: {
                name: '🎯 AÇÃO (Executor)',
                description: 'Você é focado em resultados, direto e competitivo. Gosta de desafios e toma decisões rápidas. Seu estilo é prático e orientado para metas.'
            },
            inspiracao: {
                name: '✨ INSPIRAÇÃO (Comunicador)',
                description: 'Você é criativo, entusiasta e sociável. Inspira outras pessoas e gosta de trabalhar em equipe. Seu estilo é inovador e motivador.'
            },
            harmonia: {
                name: '🤝 HARMONIA (Planejador)',
                description: 'Você é calmo, cooperativo e valoriza a estabilidade. Gosta de manter bom relacionamento com todos. Seu estilo é organizado e equilibrado.'
            },
            clareza: {
                name: '🧠 CLAREZA (Analista)',
                description: 'Você é analítico, detalhista e busca precisão. Gosta de dados e informações bem estruturadas. Seu estilo é lógico e sistemático.'
            }
        };

        // Perguntas do Teste
        const questions = [
            { text: 'Prefiro tomar decisões rápidas e diretas', profile: 'acao' },
            { text: 'Gosto de inspirar e motivar outras pessoas', profile: 'inspiracao' },
            { text: 'Valorizo a harmonia e o bom relacionamento', profile: 'harmonia' },
            { text: 'Prefiro analisar dados antes de decidir', profile: 'clareza' },
            { text: 'Sou competitivo e focado em resultados', profile: 'acao' },
            { text: 'Gosto de inovar e criar novas ideias', profile: 'inspiracao' },
            { text: 'Prefiro trabalhar em equipe de forma cooperativa', profile: 'harmonia' },
            { text: 'Gosto de estrutura e organização', profile: 'clareza' },
            { text: 'Tomo riscos calculados para alcançar objetivos', profile: 'acao' },
            { text: 'Sou comunicativo e gosto de networking', profile: 'inspiracao' },
            { text: 'Evito conflitos e busco consenso', profile: 'harmonia' },
            { text: 'Sou meticuloso e atento aos detalhes', profile: 'clareza' },
            { text: 'Minha energia vem de vencer desafios', profile: 'acao' },
            { text: 'Minha energia vem de conectar pessoas', profile: 'inspiracao' },
            { text: 'Minha energia vem de ajudar os outros', profile: 'harmonia' },
            { text: 'Minha energia vem de resolver problemas complexos', profile: 'clareza' }
        ];

        let currentQuestion = 0;
        let answers = {};

        // Inicializar
        function init() {
            renderQuestions();
        }

        // Renderizar Perguntas
        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = `
                <div class="question-container">
                    <div class="question-number">Pergunta ${currentQuestion + 1} de ${questions.length}</div>
                    <div class="question-text">${questions[currentQuestion].text}</div>
                    <div class="scale-container">
                        ${[1, 2, 3, 4, 5].map(value => `
                            <button class="scale-button ${answers[currentQuestion] === value ? 'selected' : ''}" 
                                    onclick="selectAnswer(${value})">
                                ${value}
                            </button>
                        `).join('')}
                    </div>
                    <div class="scale-labels">
                        <span>Nada a ver</span>
                        <span>Totalmente</span>
                    </div>
                </div>
            `;
            updateProgress();
        }

        // Selecionar Resposta
        function selectAnswer(value) {
            answers[currentQuestion] = value;
            
            // Animar saída da pergunta
            const questionContainer = document.querySelector('.question-container');
            questionContainer.style.opacity = '0';
            questionContainer.style.transform = 'translateY(20px)';
            
            // Aguardar animação e ir para próxima pergunta
            setTimeout(() => {
                if (currentQuestion < questions.length - 1) {
                    currentQuestion++;
                    renderQuestions();
                    // Animar entrada da nova pergunta
                    setTimeout(() => {
                        const newQuestion = document.querySelector('.question-container');
                        newQuestion.style.opacity = '1';
                        newQuestion.style.transform = 'translateY(0)';
                    }, 50);
                } else {
                    finishTest();
                }
            }, 300);
        }



        // Atualizar Progresso
        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `Pergunta ${currentQuestion + 1} de ${questions.length}`;
        }

        // Começar Teste
        function startQuestions() {
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            
            if (!nome || !email) {
                showAlert('Por favor, preencha nome e e-mail.', 'error');
                return;
            }

            document.querySelector('.form-section').classList.remove('active');
            document.querySelector('.questions-section').classList.add('active');
            renderQuestions();
            gtag('event', 'teste_iniciado');
        }

        // Finalizar Teste
        function finishTest() {
            const scores = {
                acao: 0,
                inspiracao: 0,
                harmonia: 0,
                clareza: 0
            };

            for (let i = 0; i < questions.length; i++) {
                const profile = questions[i].profile;
                scores[profile] += answers[i] || 0;
            }

            // Encontrar perfil predominante
            const maxScore = Math.max(...Object.values(scores));
            const primaryProfile = Object.keys(scores).find(key => scores[key] === maxScore);

            // Renderizar resultados
            renderResults(scores, primaryProfile);
            gtag('event', 'teste_completo', {'perfil': primaryProfile, 'pontos': maxScore});
        }

        // Renderizar resultados
        function renderResults(scores, primaryProfile) {
            const profile = profileDescriptions[primaryProfile];
            document.getElementById('profileName').textContent = profile.name;
            document.getElementById('profileDescription').textContent = profile.description;

            // Renderizar gráfico
            const chartHtml = Object.entries(scores).map(([key, value]) => `
                <div class="profile-bar">
                    <div class="profile-label">
                        <span>${profileDescriptions[key].name}</span>
                        <span>${value} pontos</span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill ${key}" style="width: ${(value / 20) * 100}%">
                            ${Math.round((value / 20) * 100)}%
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('resultsChart').innerHTML = chartHtml;
            window.scores = scores;
            window.primaryProfile = primaryProfile;

            document.querySelector('.questions-section').classList.remove('active');
            document.querySelector('.results-section').classList.add('active');
        }

        // Baixar PDF
        function downloadPDF() {
            const element = document.querySelector('.results-section');
            const opt = {
                margin: 10,
                filename: `Teste-Perfil-${document.getElementById('nome').value}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };

            html2pdf().set(opt).from(element).save();
            gtag('event', 'download_pdf', {'perfil': window.primaryProfile});
        }

        // Enviar para Google Sheets
        function sendToSheets() {
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const data = {
                nome: nome,
                email: email,
                perfil: window.primaryProfile,
                acao: window.scores.acao,
                inspiracao: window.scores.inspiracao,
                harmonia: window.scores.harmonia,
                clareza: window.scores.clareza,
                data: new Date().toLocaleString('pt-BR')
            };

            // URL corrigida do Google Apps Script
            const formUrl = 'https://script.google.com/macros/s/AKfycbw7O5iLmuDGPjikuta5yg4teZ6cDzUayD1Kv7IiMIBHj6UEGStUoxdhlL9lJSl46Ig-0w/exec';

            // Enviar dados como JSON
            fetch(formUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data),
                mode: 'no-cors'
            }).then(() => {
                showAlert('✓ Dados enviados com sucesso! Você receberá um e-mail em breve.', 'success');
                gtag('event', 'envio_sheets', {'perfil': window.primaryProfile});
            }).catch(() => {
                showAlert('Houve um erro ao enviar os dados. Tente novamente.', 'error');
            });
        }

        // Mostrar alerta
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);

            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        // Reiniciar Teste
        function restartTest() {
            currentQuestion = 0;
            answers = {};
            document.querySelector('.results-section').classList.remove('active');
            document.querySelector('.form-section').classList.add('active');
            document.getElementById('nome').value = '';
            document.getElementById('email').value = '';
        }

        // Inicializar ao carregar
        window.addEventListener('load', init);
    </script>
</body>
</html>
